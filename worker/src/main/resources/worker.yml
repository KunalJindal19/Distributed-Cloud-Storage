# Every operational setting comes from an environment variable (see README "Configuration").
spring:
  application:
    name: objectstore-worker
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Must stay above SHUTDOWN_DRAIN_TIMEOUT and below the container's stop_grace_period (10 s).
    timeout-per-shutdown-phase: 6s
  autoconfigure:
    # A worker has no database. These only matter when the controller's jars share the classpath
    # (the in-process system tests); in a worker container the classes do not exist.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcClientAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

server:
  port: ${PORT:8001}
  shutdown: graceful

worker:
  id: ${WORKER_ID}
  data-dir: ${DATA_DIR:/data}
  controller-url: ${CONTROLLER_URL:http://controller:8000}
  advertise-url: ${ADVERTISE_URL:}
  max-chunk-size: ${CHUNK_SIZE:1048576}
  heartbeat-interval-seconds: ${HEARTBEAT_INTERVAL:2}
  heartbeat-http-timeout-seconds: ${HEARTBEAT_HTTP_TIMEOUT:3}
  # Showcase output (docker-compose.showcase.yml): this worker's state every N seconds. Off by default.
  state-print-interval-seconds: ${STATE_PRINT_INTERVAL:0}
  heartbeat-min-gap-ms: ${HEARTBEAT_MIN_GAP_MS:250}
  change-log-max: ${CHANGE_LOG_MAX:10000}
  max-changes-per-message: ${MAX_CHANGES_PER_MESSAGE:2000}
  max-changes-per-put-answer: ${MAX_CHANGES_PER_PUT_ANSWER:256}
  report-segment-size: ${REPORT_SEGMENT_SIZE:2000}
  scan-interval-seconds: ${SCAN_INTERVAL:10}
  scan-max-bytes-per-sec: ${SCAN_MAX_BYTES_PER_SEC:33554432}
  disk-check-interval-seconds: ${DISK_CHECK_INTERVAL:30}
  connect-timeout-seconds: ${CONNECT_TIMEOUT:2}
  read-timeout-seconds: ${READ_TIMEOUT:10}
  tombstone-max: ${TOMBSTONE_MAX:100000}
  executor-queue-max: ${EXECUTOR_QUEUE_MAX:500}
  server-read-timeout-seconds: ${SERVER_READ_TIMEOUT:20}
  shutdown-drain-timeout-seconds: ${SHUTDOWN_DRAIN_TIMEOUT:3}
  exit-on-fail-stop: true
  background-enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework: WARN
    org.apache: WARN
    org.hibernate.validator: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %msg%n"
