<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object Store Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1c2330; --muted: #5b6577; --line: #dfe3ea;
    --accent: #2456d6; --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --warn: #b45309; --warn-bg: #fef3c7; --idle: #6b7280; --idle-bg: #eceef2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 26px; }
  h1 span { color: var(--accent); }
  h2 { margin: 26px 0 10px; font-size: 18px; }
  .muted { color: var(--muted); font-size: 15px; }
  #updated { margin-left: auto; }
  #banner { display: none; background: var(--bad); color: #fff; padding: 10px 14px; border-radius: 8px;
            font-weight: 600; margin-bottom: 14px; }
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .workers { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 14px; }
  .kpi .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi.alert .value { color: var(--bad); }
  .kpi .sub { font-size: 14px; color: var(--muted); }
  .kpi .sub b.alert { color: var(--bad); }
  .worker h3 { margin: 0 0 6px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
  .worker.dead { border-color: var(--bad); background: #fff8f8; }
  .pill { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: .03em; }
  .pill.ALIVE { background: var(--ok-bg); color: var(--ok); }
  .pill.DEAD { background: var(--bad-bg); color: var(--bad); }
  .worker dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 15px; }
  .worker dt { color: var(--muted); }
  .worker dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 14px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.cell { text-align: center; width: 110px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
  .tag { display: inline-block; min-width: 46px; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 13px; }
  .tag.OK { background: var(--ok-bg); color: var(--ok); }
  .tag.CORRUPT { background: var(--bad-bg); color: var(--bad); }
  .tag.MISSING { background: var(--warn-bg); color: var(--warn); }
  .tag.offline { background: var(--idle-bg); color: var(--idle); }
  .tag.copied { background: var(--ok-bg); color: var(--ok); }
  .tag.trimmed { background: var(--idle-bg); color: var(--idle); }
  .tag.purged { background: var(--warn-bg); color: var(--warn); }
  .tag.unrecoverable { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); padding: 6px 0; }
  .reason { white-space: normal; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mini Distributed <span>Object Store</span></h1>
    <span class="muted" id="config">connecting&hellip;</span>
    <span class="muted" id="updated"></span>
  </header>
  <div id="banner">controller unreachable &mdash; retrying every 2 s</div>

  <section class="grid kpis" id="kpis"></section>

  <h2>Workers</h2>
  <section class="grid workers" id="workers"></section>

  <h2>Chunk placement of the newest object</h2>
  <section class="card">
    <div class="muted" id="object">no objects stored yet</div>
    <div class="scroll"><table id="placement"></table></div>
  </section>

  <h2>Repair log <span class="muted">(last 20 actions, newest first)</span></h2>
  <section class="card scroll">
    <table id="repairs"></table>
    <div class="empty" id="no-repairs">nothing has needed repairing yet</div>
  </section>
</main>

<script>
"use strict";
const POLL_MS = 2000;
const $ = (id) => document.getElementById(id);

/** el("td", {class: "num"}, "text" | Node, ...) -- all text goes through textContent, never innerHTML. */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
  for (const child of children) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}

function kpi(label, value, alert, sub) {
  const card = el("div", {class: "card kpi" + (alert ? " alert" : "")},
      el("div", {class: "label"}, label), el("div", {class: "value"}, value));
  if (sub) card.append(sub);
  return card;
}

function ago(iso) {
  const seconds = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return seconds < 90 ? seconds + " s ago" : Math.round(seconds / 60) + " min ago";
}

function renderStatus(status) {
  const c = status.config;
  $("config").textContent = `chunk ${(c.chunk_size / 1048576).toFixed(c.chunk_size % 1048576 ? 2 : 0)} MiB · ` +
      `replication factor ${c.replication_factor} · worker dead after ${c.heartbeat_timeout} s · ` +
      `repair every ${c.repair_interval} s · scrub every ${c.scrub_interval} s`;

  const r = status.replicas;
  const replicaSub = el("div", {class: "sub"},
      el("b", {class: r.corrupt > 0 ? "alert" : ""}, r.corrupt + " corrupt"), " · ",
      el("b", {class: r.missing > 0 ? "alert" : ""}, r.missing + " missing"));
  $("kpis").replaceChildren(
      kpi("Objects", status.objects),
      kpi("Chunks", status.chunks),
      kpi("Copies OK", r.ok, r.corrupt + r.missing > 0, replicaSub),
      kpi("Under-replicated", status.under_replicated, status.under_replicated > 0),
      kpi("Over-replicated", status.over_replicated, status.over_replicated > 0));

  const workers = [...status.workers].sort((a, b) => a.worker_id.localeCompare(b.worker_id, undefined, {numeric: true}));
  $("workers").replaceChildren(...workers.map((w) =>
      el("div", {class: "card worker" + (w.status === "DEAD" ? " dead" : "")},
          el("h3", {}, w.worker_id, el("span", {class: "pill " + w.status}, w.status)),
          el("dl", {},
              el("dt", {}, "address"), el("dd", {class: "mono"}, w.url),
              el("dt", {}, "last heartbeat"), el("dd", {}, ago(w.last_seen)),
              el("dt", {}, "chunk copies"), el("dd", {}, w.chunk_count)))));

  const events = [...status.repair_log].reverse().slice(0, 20);
  $("no-repairs").style.display = events.length ? "none" : "";
  $("repairs").replaceChildren(...(events.length ? [
    el("tr", {}, ...["time (UTC)", "event", "chunk", "from → to", "reason"].map((h) => el("th", {}, h))),
    ...events.map((e) => el("tr", {},
        el("td", {class: "mono"}, e.time.slice(11, 19)),
        el("td", {}, el("span", {class: "tag " + e.event}, e.event)),
        el("td", {class: "mono", title: e.chunk_id}, e.chunk_id.slice(0, 8) + "…" + e.chunk_id.slice(-6)),
        el("td", {}, (e.source || "–") + " → " + (e.target || "–")),
        el("td", {class: "reason"}, e.reason)))] : []));
  return workers;
}

function renderPlacement(object, workers) {
  if (!object) {
    $("object").textContent = "no objects stored yet";
    $("placement").replaceChildren();
    return;
  }
  $("object").replaceChildren(
      el("b", {}, object.name), ` · ${object.size.toLocaleString()} bytes · ${object.content_type} · `,
      el("code", {}, object.object_id), " · replication ",
      el("span", {class: "tag " + (object.replication_ok ? "OK" : "CORRUPT")}, object.replication_ok ? "OK" : "DEGRADED"));
  const alive = Object.fromEntries(workers.map((w) => [w.worker_id, w.status === "ALIVE"]));
  const header = el("tr", {}, el("th", {}, "#"), el("th", {}, "chunk"), el("th", {}, "bytes"),
      ...workers.map((w) => el("th", {style: "text-align:center"}, w.worker_id)));
  const rows = object.chunks.map((chunk) => {
    const byWorker = Object.fromEntries(chunk.locations.map((l) => [l.worker_id, l]));
    return el("tr", {},
        el("td", {class: "num"}, chunk.index),
        el("td", {class: "mono"}, "…" + chunk.chunk_id.slice(-12)),
        el("td", {class: "num"}, chunk.size.toLocaleString()),
        ...workers.map((w) => {
          const location = byWorker[w.worker_id];
          if (!location) return el("td", {class: "cell"}, "");
          const offline = !alive[w.worker_id];
          return el("td", {class: "cell"}, el("span",
              {class: "tag " + (offline ? "offline" : location.status), title: offline ? "worker is DEAD" : ""},
              offline ? location.status + " (down)" : location.status));
        }));
  });
  $("placement").replaceChildren(header, ...rows);
  if (!object.chunks.length) $("placement").replaceChildren(el("tr", {}, el("td", {class: "empty"}, "empty object: no chunks")));
}

async function getJson(path) {
  const response = await fetch(path, {cache: "no-store"});
  if (!response.ok) throw new Error(path + " -> " + response.status);
  return response.json();
}

async function refresh() {
  try {
    const status = await getJson("/api/v1/cluster/status");
    const workers = renderStatus(status);
    const newest = (await getJson("/api/v1/objects?limit=1")).items[0];
    renderPlacement(newest ? await getJson(`/api/v1/objects/${newest.object_id}/metadata`).catch(() => null) : null, workers);
    $("banner").style.display = "none";
    $("updated").textContent = "last updated " + new Date().toLocaleTimeString();
  } catch (error) {
    $("banner").style.display = "block";
  } finally {
    setTimeout(refresh, POLL_MS);
  }
}
refresh();
</script>
</body>
</html>
