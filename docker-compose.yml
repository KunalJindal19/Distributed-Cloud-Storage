# Mini Distributed Cloud Object Store, HDFS-style
#
#   1 controller  - the NameNode: namespace on disk, block map in memory; port 8000 is the only
#                   one published to the host
#   4 workers     - DataNodes: one persistent volume each, reachable only inside the network
#   1 client      - a ready-to-use CLI container (curl, jq and the oscli command)
#
# Start:  docker compose up -d --wait            downloads the published images from Docker Hub
#         make up                                 builds the images from this checkout instead
#                                                 (adds docker-compose.build.yml)
# Stop:   docker compose down                    (data is kept; add -v to wipe it)
#
# Images: ${OBJECTSTORE_REPO}/objectstore-{controller,worker,client}:${OBJECTSTORE_VERSION}, published for
# linux/amd64 and linux/arm64 by "make publish". Every release gets a new version, so a machine can
# never keep running an old image under the tag a newer checkout asks for.
# Chaos:  docker compose -f docker-compose.yml -f docker-compose.chaos.yml up -d   (fault injection on)

name: objectstore

# Settings shared by every service. Fault injection is off unless the chaos override sets it.
x-common-environment: &common-environment
  CONNECT_TIMEOUT: "2"
  READ_TIMEOUT: "10"
  LOG_LEVEL: INFO
  FAULT_DELAY_MS: "0"
  FAULT_DROP_RATE: "0"
  FAULT_DUP_RATE: "0"

# All four workers run the same image; they differ only in WORKER_ID, PORT and their volume.
x-worker: &worker
  image: ${OBJECTSTORE_REPO:-kunaljindal19}/objectstore-worker:${OBJECTSTORE_VERSION:-5.0.0}
  depends_on:
    controller:
      condition: service_healthy
  # A crashed (or fail-stopped, exit 70) worker comes back by itself; "docker stop" still keeps it
  # stopped (for the demo). The grace period stays above Spring's 6 s shutdown phase, which stays above
  # SHUTDOWN_DRAIN_TIMEOUT (3 s): mutations in progress finish before the process stops.
  restart: unless-stopped
  stop_grace_period: 10s
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/health > /dev/null || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 20s
  networks: [objectstore-net]

x-worker-environment: &worker-environment
  <<: *common-environment
  CONTROLLER_URL: http://controller:8000
  DATA_DIR: /data
  CHUNK_SIZE: "1048576"
  HEARTBEAT_INTERVAL: "2"          # heartbeat period (s); sooner when changes are waiting
  HEARTBEAT_MIN_GAP_MS: "250"      # earliest next heartbeat when changes or report segments wait
  HEARTBEAT_HTTP_TIMEOUT: "3"      # must stay below STALE_AFTER
  TOMBSTONE_MAX: "100000"          # above this many tombstones the worker asks for a resync
  EXECUTOR_QUEUE_MAX: "500"        # commands waiting to run; beyond: CMD_FAILED(busy), VERIFY dropped
  SERVER_READ_TIMEOUT: "20"        # longest a chunk PUT may take to deliver its body (s)
  SHUTDOWN_DRAIN_TIMEOUT: "3"      # on shutdown, mutations in progress get this long to finish (s)
  CHANGE_LOG_MAX: "10000"          # un-acknowledged changes kept; overflow -> full report
  MAX_CHANGES_PER_MESSAGE: "2000"  # changes per heartbeat
  MAX_CHANGES_PER_PUT_ANSWER: "256" # changes per answer to a controller's chunk PUT
  REPORT_SEGMENT_SIZE: "2000"      # entries per full-report segment
  SCAN_INTERVAL: "10"              # block scanner: at most one pass per this many seconds
  SCAN_MAX_BYTES_PER_SEC: "33554432" # block scanner read rate limit (32 MiB/s)
  DISK_CHECK_INTERVAL: "30"        # volume probe period (s)

services:
  controller:
    image: ${OBJECTSTORE_REPO:-kunaljindal19}/objectstore-controller:${OBJECTSTORE_VERSION:-5.0.0}
    container_name: controller
    hostname: controller
    restart: unless-stopped
    stop_grace_period: 5s
    ports:
      - "${CONTROLLER_PORT:-9000}:8000"
    environment:
      <<: *common-environment
      PORT: "8000"
      DB_PATH: /data/meta.db
      CHUNK_SIZE: "1048576"          # 1 MB chunks
      REPLICATION_FACTOR: "2"        # two copies of every chunk
      STALE_AFTER: "6"               # silence -> STALE (avoided, copies still count)
      DEAD_AFTER: "12"               # silence -> DEAD (copies forgotten and re-replicated)
      STALE_RATIO: "0.5"             # above this fraction of STALE workers, write to them anyway
      HEALTH_INTERVAL: "1"
      MONITOR_INTERVAL: "1"          # replication monitor (planner) period
      OP_RESEND_INITIAL: "15"        # an unanswered op is resent after this (same version), then backing off
      OP_RESEND_MAX: "240"           # ... up to this
      OP_MAX_INSERT_ATTEMPTS: "5"    # an unanswered copy is dropped and re-planned after this many sends
      TARGET_BACKOFF: "30"           # avoid a (chunk, target) pair for this long after a failed copy
      MAX_STREAMS: "2"               # in-flight copies per source worker
      MAX_COMMANDS_PER_WORKER: "1000"
      MAX_MESSAGE_AGE: "10"          # reject worker messages sent longer ago than this
      SAFE_MODE_THRESHOLD: "0.999"
      SAFE_MODE_EXTENSION: "5"
      SAFE_MODE_TIMEOUT: "30"
      ORPHAN_GC_DELAY: "60"          # no orphan deletion during the first minute after a start
      ORPHAN_GC_MAX_FRACTION: "0.5"
      MIN_FREE_BYTES: "16777216"
      RESYNC_INTERVAL: "${RESYNC_INTERVAL:-3600}" # periodic fenced resync of every worker (s), ± RESYNC_JITTER
      RESYNC_JITTER: "0.1"
      RESYNC_MAX_CONCURRENT: "1"     # periodic and GC-triggered resyncs at once
      RESYNC_STALL_TIMEOUT: "60"     # no segment progress for this long: the next report attempt
      VERIFY_FRESH_FOR_DELETE: "3600" # how recent a survivor's VERIFY must be before a surplus copy is deleted
      VERIFY_RESEND: "60"            # minimum gap between VERIFYs of one copy
      DIRECT_OBJECT_DELETES: "true"  # a client delete sends DELETE /internal/chunks/{id} to the holders at once
      INVARIANT_CHECKS: "1"            # the rolling invariant check, every planner tick
      PLANNER_VISIT_BUDGET: "2000"   # chunks visited in the under-replication levels per tick
      POSTPONED_BUDGET: "1000"       # postponed chunks re-checked per tick
      ROLLING_CHECK_CHUNKS: "1000"   # chunks checked by the rolling invariant check per tick
      MAX_LOCK_HOLD_MS: "5"          # longest continuous write-lock hold by the writer before it yields
      APPLY_QUEUE_CAPACITY: "10000"  # tasks; when full, worker changes are not acknowledged
      UPLOAD_COMMIT_WAIT: "10"       # an upload or delete waits this long for its task, then answers anyway
      DOWNLOAD_SETTLE_WAIT: "5"      # a download waits this long for a just-committed chunk
      CLEANUP_BUDGET: "2000"         # waiting ledger deletions re-checked per monitor tick
    volumes:
      - controller_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/health > /dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [objectstore-net]

  # The four workers are identical; only the id, the port and the volume differ.
  # container_name is fixed so that "docker stop worker2" / "docker start worker2" work as written.
  worker1:
    <<: *worker
    container_name: worker1
    hostname: worker1
    environment:
      <<: *worker-environment
      WORKER_ID: worker1
      PORT: "8001"
    volumes:
      - worker1_data:/data

  worker2:
    <<: *worker
    container_name: worker2
    hostname: worker2
    environment:
      <<: *worker-environment
      WORKER_ID: worker2
      PORT: "8002"
    volumes:
      - worker2_data:/data

  worker3:
    <<: *worker
    container_name: worker3
    hostname: worker3
    environment:
      <<: *worker-environment
      WORKER_ID: worker3
      PORT: "8003"
    volumes:
      - worker3_data:/data

  worker4:
    <<: *worker
    container_name: worker4
    hostname: worker4
    environment:
      <<: *worker-environment
      WORKER_ID: worker4
      PORT: "8004"
    volumes:
      - worker4_data:/data

  # A client inside the network. It only knows the controller's address.
  # The project directory is mounted at /work so files can be uploaded from / downloaded to it.
  client:
    image: ${OBJECTSTORE_REPO:-kunaljindal19}/objectstore-client:${OBJECTSTORE_VERSION:-5.0.0}
    container_name: client
    hostname: client
    init: true
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      controller:
        condition: service_healthy
    environment:
      BASE_URL: http://controller:8000
    volumes:
      - .:/work
    working_dir: /work
    networks: [objectstore-net]

volumes:
  controller_data: {}
  worker1_data: {}
  worker2_data: {}
  worker3_data: {}
  worker4_data: {}

networks:
  objectstore-net:
    driver: bridge
